server:
  port: 0

spring:
  datasource:
    url: jdbc:h2:mem:ea_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  # 测试不依赖 Redis：排除自动装配，避免启动期连接 6379
  data:
    redis:
      repositories:
        enabled: false

logging:
  level:
    root: WARN
    com.electronics.assembly: INFO
